states:
  Q: "Quantization Layer"
  S1: "Structure Layer 1"
  S2: "Structure Layer 2"

# Definition of active states
s2_state:
  none_max: 0.02      # Tolerancia de ruido subida a 0.02 para no descartar núcleos sucios
  latent_max: 0.15
  # Si S2 > 0.15 es 'structured'

tiers:
  # Shares relativos de energía necesarios para activar Tier
  T_Q_rel_min: 0.18   # Bajado levemente para permitir modos nucleares más distribuidos
  T_S1_rel_min: 0.08
  T_S2_rel_min: 0.06

# Memory configuration for layers
memory:
  S1_terms: 3
  S2_terms: 5         # Núcleos complejos requieren más memoria